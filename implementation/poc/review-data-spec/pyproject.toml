[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "review-data-spec"
version = "0.1.0"
description = "Local evidence preparation and report validation for an agent-led data specification review"
requires-python = ">=3.11"
dependencies = ["pdfplumber==0.11.10", "jsonschema==4.25.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "reportlab==4.4.9"]

[project.scripts]
review-data-spec = "review_data_spec.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
review_data_spec = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
